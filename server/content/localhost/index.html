<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dungeon Blitz - Original Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
  </style>

  <!-- URL Rewriter for Port & Host Compatibility -->
  <script>
    (function() {
      const currentOrigin = window.location.origin;
      const currentHost = window.location.host;

      function rewrite(url) {
        if (!url || typeof url !== 'string') return url;
        if (url.includes('api.gameanalytics.com')) {
          return currentOrigin + '/1/cc9c404568c085b07491b25d000f6094/design';
        }
        return url.replace(/^http:\/\/(localhost|127\.0\.0\.1)(?::80)?(\/.*)$/, currentOrigin + '$2');
      }

      // Intercept window.fetch
      const origFetch = window.fetch;
      window.fetch = function(resource, init) {
        if (typeof resource === 'string') {
          resource = rewrite(resource);
        } else if (resource && resource.url) {
          const newUrl = rewrite(resource.url);
          resource = new Request(newUrl, resource);
        }
        return origFetch.call(this, resource, init);
      };

      // Intercept XMLHttpRequest
      const origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        if (typeof url === 'string') {
          url = rewrite(url);
        }
        return origOpen.call(this, method, url, ...rest);
      };
    })();
  </script>

  <!-- Load Ruffle WebAssembly Flash Player -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    const wsUrl = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      allowScriptAccess: true,
      openUrlMode: "confirm",
      socketProxy: [
        { host: "127.0.0.1", port: 8080, proxyUrl: wsUrl },
        { host: "127.0.0.1", port: 443, proxyUrl: wsUrl },
        { host: "127.0.0.1", port: 8092, proxyUrl: wsUrl },
        { host: "127.0.0.1", port: 7498, proxyUrl: wsUrl },
        { host: "localhost", port: 8080, proxyUrl: wsUrl },
        { host: "localhost", port: 443, proxyUrl: wsUrl },
        { host: "localhost", port: 8092, proxyUrl: wsUrl },
        { host: "localhost", port: 7498, proxyUrl: wsUrl },
        { host: window.location.hostname, port: 8080, proxyUrl: wsUrl },
        { host: window.location.hostname, port: 443, proxyUrl: wsUrl },
        { host: window.location.hostname, port: 8092, proxyUrl: wsUrl },
        { host: window.location.hostname, port: 7498, proxyUrl: wsUrl }
      ]
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>

<body>
  <div id="game-container"></div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Use timestamp query param to prevent browser caching stale SWFs
      const swfUrl = "p/cbv/DungeonBlitz.swf?fv=cbq&gv=cbv&v=" + Date.now();
      const container = document.getElementById("game-container");
      
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      container.appendChild(player);

      player.load({
        url: swfUrl,
        parameters: { fv: "cbq", gv: "cbv" },
        allowScriptAccess: true,
        letterbox: "on",
        backgroundColor: "#000000"
      });
    });
  </script>
</body>
</html>
