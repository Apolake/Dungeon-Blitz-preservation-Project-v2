version: "3.8"

services:
  dungeon-blitz:
    build:
      context: .
      dockerfile: Dockerfile
    image: dungeon-blitz:latest
    container_name: dungeon-blitz-server
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT_HTTP=8090
      - TCP_PORTS=8092
      - DATA_DIR=/data
    ports:
      # Web Client & WebSocket Gateway
      - "8090:8090"
      # Legacy TCP Game Server (For Flash Projector)
      - "8092:8092"
    volumes:
      # Persistent SQLite Database & Character Saves
      - dungeon-blitz-data:/data
      # Mount server code and assets directly for instant updates on git pull
      - ./server:/app/server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/crossdomain.xml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  dungeon-blitz-data:
    name: dungeon-blitz-data
