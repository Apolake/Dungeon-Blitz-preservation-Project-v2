version: "3.8"

services:
  dungeon-blitz:
    build:
      context: .
      dockerfile: Dockerfile
    image: dungeon-blitz:latest
    container_name: dungeon-blitz-server
    restart: unless-stopped
    environment:
      - MULTIPLAYER_MODE=true
      - MULTIPLAYER_BASE_IP=${MULTIPLAYER_BASE_IP:-144.91.77.234}
      - STATIC_PORT=8090
      - GAME_PORT=8092
      - GAME_PORTS=8092,7498
      - CLIENT_GAME_PORT=7498
      - ENABLE_POLICY_SERVER=true
    ports:
      # Web Client & Static Assets
      - "8090:8090"
      # TCP Game / Login Server
      - "8092:8092"
      # Native Flash Game Port
      - "7498:7498"
      # Flash Socket Policy Port
      - "843:843"
    volumes:
      # Persistent Character Saves & Accounts
      - ./src/server/data/saves:/app/src/server/data/saves
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
