<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dungeon Blitz</title>
<!-- Updater-Bildschirm im Stil der Webseite (website/site.css): Logo, Status, Fortschritt, Patchnotes.
     Schriften liegen in fonts/ (Lilita One, Nunito, OFL), ohne sie greift die Systemschrift. -->
<style>
  @font-face { font-family: "Lilita One"; src: url(fonts/LilitaOne-Regular.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: Nunito; src: url(fonts/Nunito.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }
  :root {
    --bg: #0d1314;
    --line: #223031;
    --text: #edf1f0;
    --muted: #97a5a2;
    --faint: #6c7a78;
    --accent: #f7931e;
    --accent-hi: #ffa840;
    --danger: #ff8a7a;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --display: "Lilita One", Nunito, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
               font: 15px/1.5 Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
               user-select: none; cursor: default; }
  main { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; padding: 0 48px 56px; }
  .logo { width: 340px; margin-bottom: 36px; filter: drop-shadow(0 14px 24px rgba(0, 0, 0, .5));
          animation: rise 600ms var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  .panel { width: 440px; }
  #status { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  #statusText { font: 22px/1.2 var(--display); letter-spacing: .01em; }
  .error #statusText { color: var(--danger); }
  #percent { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  #track { position: relative; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  #fill { position: absolute; inset: 0; border-radius: inherit; background: var(--accent); transform-origin: left;
          transform: scaleX(0); transition: transform 200ms var(--ease-out); }
  .check #fill { transform: scaleX(.3); transition: none; animation: seek 1.2s linear infinite; }
  @keyframes seek { from { translate: -100% 0; } to { translate: 340% 0; } }
  .done #fill { background: #5fd38a; }
  .error #fill { background: var(--danger); transform: scaleX(1); opacity: .5; }

  #detail { display: flex; gap: 18px; margin-top: 12px; min-height: 22px; color: var(--muted);
            font-variant-numeric: tabular-nums; }
  #file { margin-top: 2px; min-height: 18px; font-size: 13px; color: var(--faint); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; }

  #buttons { display: none; gap: 10px; margin-top: 22px; }
  #buttons.show { display: flex; }
  button { font: 700 15px Nunito, system-ui, sans-serif; border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
           transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out); }
  button:active { transform: scale(.97); }
  button:focus-visible, .links button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .primary { background: var(--accent); color: #1a0d00; box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset; }
  .ghost { background: #172021; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  @media (hover: hover) { .primary:hover { background: var(--accent-hi); } .ghost:hover { background: #1d2829; } }

  #notes { display: none; width: 440px; margin-top: 34px; }
  #notes.show { display: block; }
  #notes h2 { font: 700 14px Nunito, system-ui, sans-serif; color: var(--muted); margin: 0 0 8px; }
  #notesText { margin: 0; max-height: 132px; overflow: auto; white-space: pre-wrap; font: 14px/1.6 Nunito, system-ui, sans-serif;
               color: #c3ccca; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #2a3839 transparent; }

  footer { position: absolute; left: 24px; right: 24px; bottom: 18px; display: flex; justify-content: space-between;
           align-items: center; font-size: 13px; color: var(--faint); }
  .links { display: flex; gap: 18px; }
  .links button { all: unset; cursor: pointer; color: var(--faint); transition: color 160ms var(--ease-out); border-radius: 4px; }
  @media (hover: hover) { .links button:hover { color: var(--text); } }
  .links button[disabled] { opacity: .4; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation-name: fade; }
    @keyframes fade { from { opacity: 0; } }
    .check #fill { animation: none; transform: scaleX(1); opacity: .25; }
    #fill { transition: none; }
  }
</style>
</head>
<body class="check">
<main>
  <img class="logo" src="logo.png" alt="Dungeon Blitz">
  <div class="panel" role="status" aria-live="polite">
    <div id="status"><span id="statusText">Checking for updates</span><span id="percent"></span></div>
    <div id="track"><div id="fill"></div></div>
    <div id="detail"></div>
    <div id="file"></div>
    <div id="buttons">
      <button id="retry" class="primary">Try again</button>
      <button id="offline" class="ghost">Play anyway</button>
    </div>
  </div>
  <section id="notes"><h2>Patch notes</h2><pre id="notesText"></pre></section>
</main>
<footer>
  <span id="version"></span>
  <div class="links">
    <button id="repair">Repair game files</button>
    <button id="log">Open log</button>
  </div>
</footer>
<script src="updater.js"></script>
</body>
</html>
